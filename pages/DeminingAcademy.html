<!DOCTYPE html>
<html lang="en" style="--game-accent-color: #83CC8F;">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#121216">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">
	<link href="../css/game-page.css" rel="stylesheet">
	<link rel="shortcut icon" type="image/x-icon" href="../assets/img/favicon/favicon.ico">
	<title>Demining Academy - TheDeiw Games</title>
</head>

<body>
	<!-- Header - Fixed Top Right -->
	<a href="../index.html" class="game-header">Other games</a>

	<!-- Video Section -->
	<section class="video-section" id="videoThumbnail">
		<img
			src="../assets/img/GamesPhotos/DeminigAcademy/DeminngAcademyMain.png"
			alt="Demining Academy Game Thumbnail"
			class="video-thumbnail"
			id="heroImage">
		<div class="play-button"></div>
	</section>

	<!-- Video Modal -->
	<div class="video-modal" id="videoModal">
		<div class="video-modal-content">
			<button class="close-modal" id="closeModal">✕</button>
			<video
				id="videoPlayer"
				src="../assets/img/GamesPhotos/DeminigAcademy/deminingacademyPreview.mp4"
				controls
				style="width: 100%; height: 100%; object-fit: contain;">
			</video>
		</div>
	</div>

	<!-- About Game Section -->
	<section class="about-game">
		<div class="game-content">
			<h1 class="game-title">Demining Academy</h1>

			<div class="game-tags">
				<span class="tag">VR</span>
				<span class="tag">Simulation</span>
			</div>

			<!-- Description -->
			<div class="info-section">
				<span class="info-label">Description</span>
				<p class="info-content">
				Virtual Reality simulation for mine awareness and the demining process.</p>
			</div>

			<!-- Release Date -->
			<div class="info-section">
				<span class="info-label">Release date</span>
				<p class="info-content">February 2026</p>
			</div>

			<!-- Platforms -->
			<div class="info-section">
				<span class="info-label">Platforms</span>
				<p class="info-content">Meta Quest, VR</p>
			</div>
		</div>

		<!-- Screenshots -->
		<div class="screenshots-section">
			<span class="info-label">Screenshots</span>
			<div class="screenshots-grid">
				<img src="../assets/img/GamesPhotos/DeminigAcademy/sc1.png" alt="Demining Academy Screenshot 1" class="screenshot">
				<img src="../assets/img/GamesPhotos/DeminigAcademy/sc2.png" alt="Demining Academy Screenshot 2" class="screenshot">
				<img src="../assets/img/GamesPhotos/DeminigAcademy/sc3.png" alt="Demining Academy Screenshot 3" class="screenshot">
				<img src="../assets/img/GamesPhotos/DeminigAcademy/sc4.png" alt="Demining Academy Screenshot 4" class="screenshot">
			</div>
		</div>
	</section>

	<!-- Install Section -->
	<aside class="install-section" id="installSection">
		<h2>Get the game</h2>
		<div class="install-links">
			<a href="https://thedeiw.itch.io/demining-academy" class="install-link" target="_blank" rel="noopener">
				<img src="../assets/img/GameDownloadLinks/itch.io.svg" alt="Itch.io">
				<span>Itch.io</span>
			</a>
			<a href="https://github.com/TheDeiw/Demining-Academy" class="install-link" target="_blank" rel="noopener">
				<img src="../assets/img/GameDownloadLinks/github.svg" alt="GitHub">
				<span>GitHub</span>
			</a>
		</div>
	</aside>

	<!-- Scripts -->
	<script src="../js/performance-detector.js"></script>
	<script src="../js/parallax.js"></script>
	<script src="../js/install-section-autohide.js"></script>
	<script>
		// Apply performance class to body for game page
		if (typeof DeviceCapability !== 'undefined') {
			const tier = DeviceCapability.capabilities.performanceTier;
			document.body.classList.add(`perf-${tier}`);
		}

		// Local Video Modal (MP4 playback, not YouTube)
		const videoThumbnail = document.getElementById("videoThumbnail");
		const videoModal = document.getElementById("videoModal");
		const videoPlayer = document.getElementById("videoPlayer");
		const closeModal = document.getElementById("closeModal");

		videoThumbnail.addEventListener("click", function () {
			videoModal.classList.add("active");
			videoPlayer.play();
			document.documentElement.style.overflowY = "hidden";
		});

		function closeVideoModal() {
			videoModal.classList.remove("active");
			videoPlayer.pause();
			videoPlayer.currentTime = 0;
			document.documentElement.style.overflowY = "";
		}

		closeModal.addEventListener("click", closeVideoModal);

		videoModal.addEventListener("click", function (e) {
			if (e.target === videoModal) {
				closeVideoModal();
			}
		});

		document.addEventListener("keydown", function (e) {
			if (e.key === "Escape" && videoModal.classList.contains("active")) {
				closeVideoModal();
			}
		});
	</script>
</body>
</html>
